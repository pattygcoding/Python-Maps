    <!--
      Pick the theme before first paint, so the page never flashes the wrong
      palette.  Same approach and storage key shape as the arcade site.
    -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('python-maps-theme');
        } catch (error) {
          stored = null;
        }
        var prefersLight =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', stored || (prefersLight ? 'light' : 'dark'));
      })();
    </script>
